<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Terminal Prompt Symbol > -->
  <path d="M14 20 L28 32 L14 44" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Modern Lightning / Activity Bolt in Center Right -->
  <path d="M37 14 L49 26 L42 28 L49 46 L33 34 L40 32 Z" fill="url(#boltGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Terminal Cursor Underline _ -->
  <line x1="28" y1="44" x2="38" y2="44" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
</svg>
