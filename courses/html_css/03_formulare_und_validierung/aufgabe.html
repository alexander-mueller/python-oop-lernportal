<body>

  <h1>Tech-Bootcamp Bewerbungsformular</h1>

  <!-- 🎯 TEILZIEL 1: Erstelle ein <form action="/api/bewerbung" method="POST">, das ein <fieldset> mit <legend> "Persönliche Daten" enthält -->


  <!-- 🎯 TEILZIEL 2: Füge ein Text-Feld für den vollständigen Namen (id="name", name="name", required) und ein E-Mail-Feld (id="email", name="email", type="email", required) mit jeweils passendem <label for="..."> hinzu -->


  <!-- 🎯 TEILZIEL 3: Füge ein Passwort-Feld (id="password", type="password", minlength="8", required) und ein Number-Feld für Programmiererfahrung in Jahren (id="experience", type="number", min="0", max="40") mit Labels hinzu -->


  <!-- 🎯 TEILZIEL 4: Füge ein Dropdown <select id="track" name="track" required> mit mindestens 3 <option>-Einträgen und ein <textarea id="motivation" name="motivation" rows="4"> mit Labels hinzu -->


  <!-- 🎯 TEILZIEL 5: Füge eine Checkbox (id="agb", type="checkbox", required) für "Ich akzeptiere die AGB" und einen <button type="submit"> "Bewerbung absenden" hinzu -->
