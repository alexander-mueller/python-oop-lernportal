<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selektoren &amp; Kaskade</title>
  <style>
    /* 🎯 TEILZIEL 1: Typ-Selektoren - Färbe body (background-color, font-family: sans-serif) und h1 (color) ein */


    /* 🎯 TEILZIEL 2: Klassen- und ID-Selektoren - Style .card (border, border-radius, padding) und #featured-card (background-color oder border-color) */


    /* 🎯 TEILZIEL 3: Kombinatoren - Nutze Kind-Selektor (ul > li) und Nachbar-Selektor (h2 + p) */


    /* 🎯 TEILZIEL 4: Attribut-Selektor - Style a[target="_blank"] (z.B. color oder text-decoration) */


    /* 🎯 TEILZIEL 5: Pseudo-Klassen - Definiere .btn:hover (background-color/color) und li:nth-child(even) (background-color) */


  </style>
</head>
<body>

  <h1>Frontend Design System</h1>

  <section class="card" id="featured-card">
    <h2>Empfohlener Kurs</h2>
    <p>Modernes CSS3 von den Grundlagen bis zur Kaskadenbeherrschung.</p>
    <a href="https://w3.org" target="_blank" class="btn">Mehr erfahren</a>
  </section>

  <section class="card">
    <h2>Lehrplan Übersicht</h2>
    <ul>
      <li>HTML5 Grundlagen</li>
      <li>CSS3 Selektoren</li>
      <li>Box-Modell &amp; Abstände</li>
      <li>CSS Variablen</li>
    </ul>
    <button type="button" class="btn">Jetzt starten</button>
  </section>

</body>
</html>
